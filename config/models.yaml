# Provider preference per tier. The first available provider wins; `heuristic` is the
# offline keyword model and is always available, so the pipeline works with no API keys.
tiers:
  t1:
    providers: [laya, claude_haiku, heuristic]
    cross_check: false          # when true and two T1 providers are up, run both; disagreement escalates
  t2:
    providers: [claude_sonnet, heuristic]
  authoring:
    providers: [claude_opus]
models:
  # Slot names are kept for strategy-file compatibility; all three are served by Kimi (Moonshot).
  claude_haiku: kimi-k2.7-code
  claude_sonnet: kimi-k2.7-code
  claude_opus: kimi-k3
  gemini: ${GEMINI_MODEL}
escalation:
  min_confidence: 0.6           # any key T1 answer below this escalates
  on_materiality: [high]
  on_active_note: true
budgets:
  total_calls_per_day: 200
  replay_calls_per_day: 2000    # backtests with model replay; separate so they never starve live triage
  t2_calls_per_day: 30
  idealab_runs_per_day: 4
timeouts_s:
  t1: 15
  t2: 60
  authoring: 300
