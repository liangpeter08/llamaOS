event_study:
  horizons_min: [5, 15, 60]     # plus "to close"
  groups: [catalyst, direction]
min_events: 8                   # fewer -> idea is labelled anecdotal and can't be promoted
holdout_days: 5                 # most recent history days reserved; scored once per idea
history_days: 60                # simulated days generated by `make seed`
schedule:
  premarket_brief: "08:30"
  post_close_review: "16:30"
