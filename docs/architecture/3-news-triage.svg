<svg xmlns="http://www.w3.org/2000/svg" width="680" height="550" viewBox="0 0 680 550" role="img"><title>llamaOS slow path (news to signals)</title><desc>Alpaca news passes a T0 code filter, then a T1 quick layer; uncertain or material stories escalate to a T2 Sonnet deep read; both write point-in-time signals consumed by the rule engine and the Idea Lab.</desc><style>svg{--b:#B4B2A9;--line:#73726C;--tp:#2C2C2A;--tsec:#5F5E5A}text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.t,.th{font-size:14px;fill:var(--tp)}.th{font-weight:500}.ts{font-size:12px;fill:var(--tsec)}.arr{stroke:var(--line);stroke-width:1.5;fill:none}.c-purple>rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th{fill:#3C3489}.c-purple>.ts{fill:#534AB7}.c-coral>rect,rect.c-coral{fill:#FAECE7;stroke:#993C1D}.c-coral>.th{fill:#712B13}.c-coral>.ts{fill:#993C1D}.c-gray>rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th{fill:#444441}.c-gray>.ts{fill:#5F5E5A}@media (prefers-color-scheme:dark){svg{--b:#5F5E5A;--line:#9C9A92;--tp:#E8E6DC;--tsec:#B4B2A9}.c-purple>rect,rect.c-purple{fill:#3C3489;stroke:#AFA9EC}.c-purple>.th{fill:#CECBF6}.c-purple>.ts{fill:#AFA9EC}.c-coral>rect,rect.c-coral{fill:#712B13;stroke:#F0997B}.c-coral>.th{fill:#F5C4B3}.c-coral>.ts{fill:#F0997B}.c-gray>rect,rect.c-gray{fill:#444441;stroke:#B4B2A9}.c-gray>.th{fill:#D3D1C7}.c-gray>.ts{fill:#B4B2A9}}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g class="c-gray"><rect x="240" y="40" width="200" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="58" text-anchor="middle" dominant-baseline="central">Alpaca news</text><text class="ts" x="340" y="78" text-anchor="middle" dominant-baseline="central">~600–900 items a day</text></g><g class="c-purple"><rect x="240" y="130" width="200" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="148" text-anchor="middle" dominant-baseline="central">T0 code filter</text><text class="ts" x="340" y="168" text-anchor="middle" dominant-baseline="central">Dedupe, universe filter</text></g><g class="c-gray"><rect x="470" y="130" width="170" height="56" rx="8" stroke-width="0.5"/><text class="th" x="555" y="148" text-anchor="middle" dominant-baseline="central">Dropped</text><text class="ts" x="555" y="168" text-anchor="middle" dominant-baseline="central">No model cost</text></g><g class="c-coral"><rect x="140" y="220" width="220" height="56" rx="8" stroke-width="0.5"/><text class="th" x="250" y="238" text-anchor="middle" dominant-baseline="central">T1 quick layer</text><text class="ts" x="250" y="258" text-anchor="middle" dominant-baseline="central">Laya / Gemini / Haiku</text></g><g class="c-coral"><rect x="420" y="220" width="220" height="56" rx="8" stroke-width="0.5"/><text class="th" x="530" y="238" text-anchor="middle" dominant-baseline="central">T2 deep read</text><text class="ts" x="530" y="258" text-anchor="middle" dominant-baseline="central">Sonnet, ≤30 calls/day</text></g><g class="c-gray"><rect x="240" y="330" width="200" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="348" text-anchor="middle" dominant-baseline="central">Point-in-time signals</text><text class="ts" x="340" y="368" text-anchor="middle" dominant-baseline="central">Typed, recorded once</text></g><g class="c-purple"><rect x="120" y="430" width="200" height="56" rx="8" stroke-width="0.5"/><text class="th" x="220" y="448" text-anchor="middle" dominant-baseline="central">Rule engine</text><text class="ts" x="220" y="468" text-anchor="middle" dominant-baseline="central">Gate entries, exits</text></g><g class="c-coral"><rect x="360" y="430" width="200" height="56" rx="8" stroke-width="0.5"/><text class="th" x="460" y="448" text-anchor="middle" dominant-baseline="central">Idea Lab</text><text class="ts" x="460" y="468" text-anchor="middle" dominant-baseline="central">Event studies, ideas</text></g><line x1="340" y1="98" x2="340" y2="128" class="arr" marker-end="url(#arrow)"/><line x1="442" y1="158" x2="468" y2="158" class="arr" marker-end="url(#arrow)"/><line x1="300" y1="188" x2="300" y2="218" class="arr" marker-end="url(#arrow)"/><text class="ts" x="390" y="238" text-anchor="middle">escalate</text><line x1="362" y1="256" x2="418" y2="256" class="arr" marker-end="url(#arrow)"/><line x1="300" y1="278" x2="300" y2="328" class="arr" marker-end="url(#arrow)"/><path d="M530 278 L530 358 L442 358" fill="none" class="arr" marker-end="url(#arrow)"/><line x1="300" y1="388" x2="250" y2="428" class="arr" marker-end="url(#arrow)"/><line x1="380" y1="388" x2="430" y2="428" class="arr" marker-end="url(#arrow)"/><rect class="c-purple" x="40" y="516" width="14" height="14" rx="3" stroke-width="0.5"/><text class="ts" x="60" y="523" dominant-baseline="central">Deterministic code</text><rect class="c-coral" x="210" y="516" width="14" height="14" rx="3" stroke-width="0.5"/><text class="ts" x="230" y="523" dominant-baseline="central">Uses an LLM</text><rect class="c-gray" x="350" y="516" width="14" height="14" rx="3" stroke-width="0.5"/><text class="ts" x="370" y="523" dominant-baseline="central">External, storage or you</text></svg>
