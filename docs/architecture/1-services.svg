<svg xmlns="http://www.w3.org/2000/svg" width="680" height="590" viewBox="0 0 680 590" role="img"><title>llamaOS services overview</title><desc>Broker and models connect to Alpaca and model providers and share PostgreSQL; the API reads the database and calls models; the dashboard talks only to the API; the owner uses the dashboard.</desc><style>svg{--b:#B4B2A9;--line:#73726C;--tp:#2C2C2A;--tsec:#5F5E5A}text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.t,.th{font-size:14px;fill:var(--tp)}.th{font-weight:500}.ts{font-size:12px;fill:var(--tsec)}.arr{stroke:var(--line);stroke-width:1.5;fill:none}.c-purple>rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th{fill:#3C3489}.c-purple>.ts{fill:#534AB7}.c-coral>rect,rect.c-coral{fill:#FAECE7;stroke:#993C1D}.c-coral>.th{fill:#712B13}.c-coral>.ts{fill:#993C1D}.c-gray>rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th{fill:#444441}.c-gray>.ts{fill:#5F5E5A}@media (prefers-color-scheme:dark){svg{--b:#5F5E5A;--line:#9C9A92;--tp:#E8E6DC;--tsec:#B4B2A9}.c-purple>rect,rect.c-purple{fill:#3C3489;stroke:#AFA9EC}.c-purple>.th{fill:#CECBF6}.c-purple>.ts{fill:#AFA9EC}.c-coral>rect,rect.c-coral{fill:#712B13;stroke:#F0997B}.c-coral>.th{fill:#F5C4B3}.c-coral>.ts{fill:#F0997B}.c-gray>rect,rect.c-gray{fill:#444441;stroke:#B4B2A9}.c-gray>.th{fill:#D3D1C7}.c-gray>.ts{fill:#B4B2A9}}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g class="c-gray"><rect x="40" y="40" width="170" height="56" rx="8" stroke-width="0.5"/><text class="th" x="125" y="58" text-anchor="middle" dominant-baseline="central">Alpaca paper</text><text class="ts" x="125" y="78" text-anchor="middle" dominant-baseline="central">Bars, news, orders</text></g><g class="c-gray"><rect x="470" y="40" width="170" height="56" rx="8" stroke-width="0.5"/><text class="th" x="555" y="58" text-anchor="middle" dominant-baseline="central">Model providers</text><text class="ts" x="555" y="78" text-anchor="middle" dominant-baseline="central">Claude, Laya, Gemini</text></g><g class="c-purple"><rect x="40" y="150" width="170" height="56" rx="8" stroke-width="0.5"/><text class="th" x="125" y="168" text-anchor="middle" dominant-baseline="central">broker</text><text class="ts" x="125" y="188" text-anchor="middle" dominant-baseline="central">Alpaca keys, no LLM</text></g><g class="c-gray"><rect x="255" y="150" width="170" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="168" text-anchor="middle" dominant-baseline="central">PostgreSQL</text><text class="ts" x="340" y="188" text-anchor="middle" dominant-baseline="central">Shared state + audit</text></g><g class="c-coral"><rect x="470" y="150" width="170" height="56" rx="8" stroke-width="0.5"/><text class="th" x="555" y="168" text-anchor="middle" dominant-baseline="central">models</text><text class="ts" x="555" y="188" text-anchor="middle" dominant-baseline="central">Model keys only</text></g><g class="c-gray"><rect x="40" y="270" width="170" height="56" rx="8" stroke-width="0.5"/><text class="th" x="125" y="288" text-anchor="middle" dominant-baseline="central">risk.yaml</text><text class="ts" x="125" y="308" text-anchor="middle" dominant-baseline="central">Read-only limits</text></g><g class="c-purple"><rect x="255" y="270" width="170" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="288" text-anchor="middle" dominant-baseline="central">api</text><text class="ts" x="340" y="308" text-anchor="middle" dominant-baseline="central">Auth, 2FA, approvals</text></g><g class="c-gray"><rect x="255" y="380" width="170" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="398" text-anchor="middle" dominant-baseline="central">dashboard</text><text class="ts" x="340" y="418" text-anchor="middle" dominant-baseline="central">Next.js UI, no keys</text></g><g class="c-gray"><rect x="255" y="480" width="170" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="498" text-anchor="middle" dominant-baseline="central">You (owner)</text><text class="ts" x="340" y="518" text-anchor="middle" dominant-baseline="central">Approve, curate, halt</text></g><line x1="125" y1="98" x2="125" y2="148" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/><line x1="555" y1="98" x2="555" y2="148" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/><line x1="212" y1="178" x2="253" y2="178" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/><line x1="427" y1="178" x2="468" y2="178" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/><line x1="125" y1="270" x2="125" y2="208" class="arr" marker-end="url(#arrow)"/><line x1="340" y1="208" x2="340" y2="268" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/><path d="M427 298 L555 298 L555 208" fill="none" class="arr" marker-end="url(#arrow)"/><line x1="340" y1="378" x2="340" y2="328" class="arr" marker-end="url(#arrow)"/><line x1="340" y1="478" x2="340" y2="438" class="arr" marker-end="url(#arrow)"/><rect class="c-purple" x="40" y="560" width="14" height="14" rx="3" stroke-width="0.5"/><text class="ts" x="60" y="567" dominant-baseline="central">Deterministic code</text><rect class="c-coral" x="210" y="560" width="14" height="14" rx="3" stroke-width="0.5"/><text class="ts" x="230" y="567" dominant-baseline="central">Uses an LLM</text><rect class="c-gray" x="350" y="560" width="14" height="14" rx="3" stroke-width="0.5"/><text class="ts" x="370" y="567" dominant-baseline="central">External, storage or you</text></svg>
