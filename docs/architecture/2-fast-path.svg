<svg xmlns="http://www.w3.org/2000/svg" width="680" height="600" viewBox="0 0 680 600" role="img"><title>llamaOS fast path (every bar close)</title><desc>A completed bar flows through the rule engine, risk guard, approval gate and executor to Alpaca paper; signals and risk.yaml feed in from the left; rejections, owner approval and the watchdog sit on the right.</desc><style>svg{--b:#B4B2A9;--line:#73726C;--tp:#2C2C2A;--tsec:#5F5E5A}text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.t,.th{font-size:14px;fill:var(--tp)}.th{font-weight:500}.ts{font-size:12px;fill:var(--tsec)}.arr{stroke:var(--line);stroke-width:1.5;fill:none}.c-purple>rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th{fill:#3C3489}.c-purple>.ts{fill:#534AB7}.c-coral>rect,rect.c-coral{fill:#FAECE7;stroke:#993C1D}.c-coral>.th{fill:#712B13}.c-coral>.ts{fill:#993C1D}.c-gray>rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th{fill:#444441}.c-gray>.ts{fill:#5F5E5A}@media (prefers-color-scheme:dark){svg{--b:#5F5E5A;--line:#9C9A92;--tp:#E8E6DC;--tsec:#B4B2A9}.c-purple>rect,rect.c-purple{fill:#3C3489;stroke:#AFA9EC}.c-purple>.th{fill:#CECBF6}.c-purple>.ts{fill:#AFA9EC}.c-coral>rect,rect.c-coral{fill:#712B13;stroke:#F0997B}.c-coral>.th{fill:#F5C4B3}.c-coral>.ts{fill:#F0997B}.c-gray>rect,rect.c-gray{fill:#444441;stroke:#B4B2A9}.c-gray>.th{fill:#D3D1C7}.c-gray>.ts{fill:#B4B2A9}}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g class="c-gray"><rect x="240" y="40" width="200" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="58" text-anchor="middle" dominant-baseline="central">Completed 1-min bar</text><text class="ts" x="340" y="78" text-anchor="middle" dominant-baseline="central">Alpaca IEX, REST poll</text></g><g class="c-purple"><rect x="240" y="130" width="200" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="148" text-anchor="middle" dominant-baseline="central">Rule engine</text><text class="ts" x="340" y="168" text-anchor="middle" dominant-baseline="central">DSL evaluator, no LLM</text></g><g class="c-purple"><rect x="240" y="220" width="200" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="238" text-anchor="middle" dominant-baseline="central">Risk guard</text><text class="ts" x="340" y="258" text-anchor="middle" dominant-baseline="central">Rejects, never clamps</text></g><g class="c-purple"><rect x="240" y="310" width="200" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="328" text-anchor="middle" dominant-baseline="central">Approval gate</text><text class="ts" x="340" y="348" text-anchor="middle" dominant-baseline="central">manual, auto or paper</text></g><g class="c-purple"><rect x="240" y="400" width="200" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="418" text-anchor="middle" dominant-baseline="central">Executor</text><text class="ts" x="340" y="438" text-anchor="middle" dominant-baseline="central">Limit bracket order</text></g><g class="c-gray"><rect x="240" y="490" width="200" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="508" text-anchor="middle" dominant-baseline="central">Alpaca paper</text><text class="ts" x="340" y="528" text-anchor="middle" dominant-baseline="central">Broker holds stop+target</text></g><g class="c-coral"><rect x="40" y="130" width="170" height="56" rx="8" stroke-width="0.5"/><text class="th" x="125" y="148" text-anchor="middle" dominant-baseline="central">News signals</text><text class="ts" x="125" y="168" text-anchor="middle" dominant-baseline="central">Can block or exit</text></g><g class="c-gray"><rect x="40" y="220" width="170" height="56" rx="8" stroke-width="0.5"/><text class="th" x="125" y="238" text-anchor="middle" dominant-baseline="central">risk.yaml</text><text class="ts" x="125" y="258" text-anchor="middle" dominant-baseline="central">Read-only limits</text></g><g class="c-gray"><rect x="470" y="220" width="170" height="56" rx="8" stroke-width="0.5"/><text class="th" x="555" y="238" text-anchor="middle" dominant-baseline="central">Rejected</text><text class="ts" x="555" y="258" text-anchor="middle" dominant-baseline="central">Written to audit log</text></g><g class="c-gray"><rect x="470" y="310" width="170" height="56" rx="8" stroke-width="0.5"/><text class="th" x="555" y="328" text-anchor="middle" dominant-baseline="central">You</text><text class="ts" x="555" y="348" text-anchor="middle" dominant-baseline="central">Approve within 90s</text></g><g class="c-purple"><rect x="470" y="490" width="170" height="56" rx="8" stroke-width="0.5"/><text class="th" x="555" y="508" text-anchor="middle" dominant-baseline="central">Watchdog</text><text class="ts" x="555" y="528" text-anchor="middle" dominant-baseline="central">Independent flatten</text></g><line x1="340" y1="98" x2="340" y2="128" class="arr" marker-end="url(#arrow)"/><line x1="340" y1="188" x2="340" y2="218" class="arr" marker-end="url(#arrow)"/><line x1="340" y1="278" x2="340" y2="308" class="arr" marker-end="url(#arrow)"/><line x1="340" y1="368" x2="340" y2="398" class="arr" marker-end="url(#arrow)"/><line x1="340" y1="458" x2="340" y2="488" class="arr" marker-end="url(#arrow)"/><line x1="212" y1="158" x2="238" y2="158" class="arr" marker-end="url(#arrow)"/><line x1="212" y1="248" x2="238" y2="248" class="arr" marker-end="url(#arrow)"/><line x1="442" y1="248" x2="468" y2="248" class="arr" marker-end="url(#arrow)"/><line x1="468" y1="338" x2="442" y2="338" class="arr" marker-end="url(#arrow)"/><line x1="468" y1="518" x2="442" y2="518" class="arr" marker-end="url(#arrow)"/><rect class="c-purple" x="40" y="570" width="14" height="14" rx="3" stroke-width="0.5"/><text class="ts" x="60" y="577" dominant-baseline="central">Deterministic code</text><rect class="c-coral" x="210" y="570" width="14" height="14" rx="3" stroke-width="0.5"/><text class="ts" x="230" y="577" dominant-baseline="central">Uses an LLM</text><rect class="c-gray" x="350" y="570" width="14" height="14" rx="3" stroke-width="0.5"/><text class="ts" x="370" y="577" dominant-baseline="central">External, storage or you</text></svg>
