<svg xmlns="http://www.w3.org/2000/svg" width="680" height="690" viewBox="0 0 680 690" role="img"><title>llamaOS authoring lane and strategy lifecycle</title><desc>Event studies feed Opus hypotheses with your theses, scored once on a holdout; you curate; the compiler and strategy chat produce DSL drafts that pass the validator, backtest, paper trading and finally hash-approved live, which is currently disabled. Proposed additions: options pricer, arbitrage checks and a trial ledger.</desc><style>svg{--b:#B4B2A9;--line:#73726C;--tp:#2C2C2A;--tsec:#5F5E5A}text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.t,.th{font-size:14px;fill:var(--tp)}.th{font-weight:500}.ts{font-size:12px;fill:var(--tsec)}.arr{stroke:var(--line);stroke-width:1.5;fill:none}.c-purple>rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th{fill:#3C3489}.c-purple>.ts{fill:#534AB7}.c-coral>rect,rect.c-coral{fill:#FAECE7;stroke:#993C1D}.c-coral>.th{fill:#712B13}.c-coral>.ts{fill:#993C1D}.c-gray>rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th{fill:#444441}.c-gray>.ts{fill:#5F5E5A}@media (prefers-color-scheme:dark){svg{--b:#5F5E5A;--line:#9C9A92;--tp:#E8E6DC;--tsec:#B4B2A9}.c-purple>rect,rect.c-purple{fill:#3C3489;stroke:#AFA9EC}.c-purple>.th{fill:#CECBF6}.c-purple>.ts{fill:#AFA9EC}.c-coral>rect,rect.c-coral{fill:#712B13;stroke:#F0997B}.c-coral>.th{fill:#F5C4B3}.c-coral>.ts{fill:#F0997B}.c-gray>rect,rect.c-gray{fill:#444441;stroke:#B4B2A9}.c-gray>.th{fill:#D3D1C7}.c-gray>.ts{fill:#B4B2A9}}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g class="c-purple"><rect x="40" y="40" width="180" height="56" rx="8" stroke-width="0.5"/><text class="th" x="130" y="58" text-anchor="middle" dominant-baseline="central">Event studies</text><text class="ts" x="130" y="78" text-anchor="middle" dominant-baseline="central">Code measures returns</text></g><g class="c-coral"><rect x="250" y="40" width="180" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="58" text-anchor="middle" dominant-baseline="central">Hypotheses (Opus)</text><text class="ts" x="340" y="78" text-anchor="middle" dominant-baseline="central">Mechanism + falsifier</text></g><g class="c-purple"><rect x="460" y="40" width="180" height="56" rx="8" stroke-width="0.5"/><text class="th" x="550" y="58" text-anchor="middle" dominant-baseline="central">Holdout + counter</text><text class="ts" x="550" y="78" text-anchor="middle" dominant-baseline="central">Scored once, N counted</text></g><g class="c-gray"><rect x="250" y="140" width="180" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="158" text-anchor="middle" dominant-baseline="central">Your theses</text><text class="ts" x="340" y="178" text-anchor="middle" dominant-baseline="central">Assumptions to test</text></g><g class="c-gray"><rect x="460" y="140" width="180" height="56" rx="8" stroke-width="0.5"/><text class="th" x="550" y="158" text-anchor="middle" dominant-baseline="central">You curate</text><text class="ts" x="550" y="178" text-anchor="middle" dominant-baseline="central">Accept, reject, edit</text></g><g class="c-coral"><rect x="250" y="240" width="180" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="258" text-anchor="middle" dominant-baseline="central">Strategy chat</text><text class="ts" x="340" y="278" text-anchor="middle" dominant-baseline="central">Proposes DSL diffs</text></g><g class="c-coral"><rect x="460" y="240" width="180" height="56" rx="8" stroke-width="0.5"/><text class="th" x="550" y="258" text-anchor="middle" dominant-baseline="central">Compiler (Opus)</text><text class="ts" x="550" y="278" text-anchor="middle" dominant-baseline="central">English to DSL draft</text></g><g class="c-purple"><rect x="460" y="340" width="180" height="56" rx="8" stroke-width="0.5"/><text class="th" x="550" y="358" text-anchor="middle" dominant-baseline="central">Validator</text><text class="ts" x="550" y="378" text-anchor="middle" dominant-baseline="central">8 rules, closed DSL</text></g><g class="c-purple"><rect x="250" y="340" width="180" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="358" text-anchor="middle" dominant-baseline="central">Backtest</text><text class="ts" x="340" y="378" text-anchor="middle" dominant-baseline="central">Recorded signals only</text></g><g class="c-purple"><rect x="40" y="340" width="180" height="56" rx="8" stroke-width="0.5"/><text class="th" x="130" y="358" text-anchor="middle" dominant-baseline="central">Paper trading</text><text class="ts" x="130" y="378" text-anchor="middle" dominant-baseline="central">Alpaca paper account</text></g><g class="c-gray"><rect x="40" y="440" width="180" height="56" rx="8" stroke-width="0.5" stroke-dasharray="4 3"/><text class="th" x="130" y="458" text-anchor="middle" dominant-baseline="central">Live</text><text class="ts" x="130" y="478" text-anchor="middle" dominant-baseline="central">Disabled for now</text></g><text class="ts" x="250" y="468" dominant-baseline="central">↻ Any edit makes a new hash and restarts at draft</text><line x1="222" y1="68" x2="248" y2="68" class="arr" marker-end="url(#arrow)"/><line x1="432" y1="68" x2="458" y2="68" class="arr" marker-end="url(#arrow)"/><line x1="340" y1="140" x2="340" y2="98" class="arr" marker-end="url(#arrow)"/><line x1="550" y1="98" x2="550" y2="138" class="arr" marker-end="url(#arrow)"/><line x1="550" y1="198" x2="550" y2="238" class="arr" marker-end="url(#arrow)"/><line x1="432" y1="268" x2="458" y2="268" class="arr" marker-end="url(#arrow)"/><line x1="550" y1="298" x2="550" y2="338" class="arr" marker-end="url(#arrow)"/><line x1="458" y1="368" x2="432" y2="368" class="arr" marker-end="url(#arrow)"/><line x1="248" y1="368" x2="222" y2="368" class="arr" marker-end="url(#arrow)"/><line x1="130" y1="398" x2="130" y2="438" class="arr" stroke-dasharray="4 3" marker-end="url(#arrow)"/><rect x="40" y="520" width="600" height="116" rx="12" fill="none" stroke="var(--b)" stroke-width="0.5" stroke-dasharray="5 4"/><text class="ts" x="60" y="540" dominant-baseline="central">Proposed from the research, not built yet</text><g class="c-gray"><rect x="60" y="560" width="180" height="56" rx="8" stroke-width="0.5" stroke-dasharray="4 3"/><text class="th" x="150" y="578" text-anchor="middle" dominant-baseline="central">Options + pricer</text><text class="ts" x="150" y="598" text-anchor="middle" dominant-baseline="central">Legs, Greeks in code</text></g><g class="c-gray"><rect x="250" y="560" width="180" height="56" rx="8" stroke-width="0.5" stroke-dasharray="4 3"/><text class="th" x="340" y="578" text-anchor="middle" dominant-baseline="central">Arbitrage checks</text><text class="ts" x="340" y="598" text-anchor="middle" dominant-baseline="central">Parity, box, surface</text></g><g class="c-gray"><rect x="440" y="560" width="180" height="56" rx="8" stroke-width="0.5" stroke-dasharray="4 3"/><text class="th" x="530" y="578" text-anchor="middle" dominant-baseline="central">Trial ledger</text><text class="ts" x="530" y="598" text-anchor="middle" dominant-baseline="central">Deflated Sharpe, PBO</text></g><rect class="c-purple" x="40" y="660" width="14" height="14" rx="3" stroke-width="0.5"/><text class="ts" x="60" y="667" dominant-baseline="central">Deterministic code</text><rect class="c-coral" x="210" y="660" width="14" height="14" rx="3" stroke-width="0.5"/><text class="ts" x="230" y="667" dominant-baseline="central">Uses an LLM</text><rect class="c-gray" x="350" y="660" width="14" height="14" rx="3" stroke-width="0.5"/><text class="ts" x="370" y="667" dominant-baseline="central">External, storage or you</text></svg>
