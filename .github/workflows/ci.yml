name: checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: llamaos
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: llamaos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U llamaos -d llamaos_test"
          --health-interval 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://llamaos:test-password@127.0.0.1:5432/llamaos_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci --no-audit --no-fund
        working-directory: services/dashboard
      - run: npm run build
        working-directory: services/dashboard
      - run: npm audit --omit=dev --registry=https://registry.npmjs.org
        working-directory: services/dashboard
