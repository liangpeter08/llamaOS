dsl: 0.1
id: strategy_12pm_execution
version: 1
source:
  text: >-
    create a strategy that will trade big tech on market open at 9:31am and that enable paper auto on this
    strategy, iterate till the backtest show positive intraday result for feb 30 2026 to april 30 2026

    change it so it runs at 9:47am

    change this to 955 runtime window

    change this to 12pm execution
  compiled_by: claude-opus-5-5
  prompt: architect@v1
assumptions:
  - "Big tech = AAPL, MSFT, NVDA, AMZN, META, GOOGL, TSLA, AMD (unchanged)."
  - "Rule (unchanged): buy a name that gapped up at least 0.3% from the prior close and is still above the day's open at the entry bar. At noon this reads as 'the gap has held through the morning'."
  - "Stop = entry minus 0.5 x 14-day daily ATR; target = 4R; flat by 15:50; nothing held overnight (unchanged)."
  - "Sizing 0.25% of equity risk per trade, up to 8 trades and 8 open positions per day (unchanged)."
  - "CHANGED: new strategy id strategy_1200_runtime, version 1, copied from strategy_955_runtime v1."
  - "CHANGED: entry window 09:55-09:56 -> 12:00-12:05. '12pm' = the close of the 11:59-12:00 bar; a symbol that doesn't qualify then can still enter on any bar up to 12:05."
  - "CHANGED: window widened from 2 to 5 minutes because all 3 qualifying signals of strategy_955_runtime on 2026-10-12 (MSFT, META, AAPL) were auto-rejected with reason strategy_window; a wider window tolerates processing delay. Cost: entries may come a few minutes after 12:00 at a slightly different price."
  - "Not based on evidence that 09:55 underperformed: neither the 09:47 nor the 09:55 version has a backtest. This is the trader's requested timing and needs its own backtest."
  - "Minute bars for these names are stored from 2026-02-12 (~162-166 sessions), so a full-period backtest is possible."
  - "Order size is about $170k-$260k per name at 0.25% risk with a ~1-1.5% stop; with the default 5% fund allocation (~$50k) most orders will be capped or rejected (AAPL was rejected for intraday_budget). The allocation ceiling is set on the Funds page, not in this file."
suggestions:
  - "Test target_r 2 alongside 4: from a noon entry a 4R target needs a 2x daily ATR move in under 4 hours, so most trades will end at the stop or the 15:50 flatten."
  - "Add 'close > vwap' to entry so the gap is confirmed as holding on volume-weighted terms by midday. Cost: fewer trades."
  - "Backtest this file and strategy_955_runtime on the same full ~165-session period before choosing an entry time; picking the minute from one short window overfits."
  - "Cap max_open_positions at 4: eight correlated big-tech longs opened in the same five minutes are close to one 2%-risk bet."
  - "Raise this strategy's allocation ceiling on the Funds page (or accept capped orders); otherwise the intraday_budget rejection will repeat."
universe:
  symbols: [AAPL, MSFT, NVDA, AMZN, META, GOOGL, TSLA, AMD]
  filters:
    - adv(20) >= min_adv
timeframe: 1min
params:
  min_adv:   {value: 500_000_000, range: [100_000_000, 5_000_000_000]}
  gap_min:   {value: 0.3%, range: [0.1%, 3%]}
  stop_mult: {value: 0.5, range: [0.1, 1.0]}
  target_r:  {value: 4.0, range: [0.5, 4.0]}
entry:
  side: long
  window: "12:00-12:05"
  when_all:
    - gap >= gap_min
    - close > day_open
sizing:
  risk_per_trade: 0.25%
exit:
  stop: entry_price - stop_mult * atr_d(14)
  target: entry_price + target_r * risk_per_share
  flatten_at: "15:50"
execution:
  mode: manual
limits:
  max_trades_per_day: 8
  max_open_positions: 8
