dsl: 0.1
id: strategy_947_run_time
version: 1
source:
  text: >-
    create a strategy that will trade big tech on market open at 9:31am and that enable paper auto on this
    strategy, iterate till the backtest show positive intraday result for feb 30 2026 to april 30 2026

    change it so it runs at 9:47am
  compiled_by: claude-opus-5-5
  prompt: architect@v1
assumptions:
  - "Big tech = AAPL, MSFT, NVDA, AMZN, META, GOOGL, TSLA, AMD (unchanged from big_tech_open_931 v1)."
  - "Rule (unchanged): buy a name that gapped up at least 0.3% from the prior close and is still above the day's open at the entry bar (gap-and-go continuation)."
  - "Stop = entry minus 0.5 x 14-day daily ATR; target = 4R; flat by 15:50; nothing held overnight (unchanged)."
  - "Sizing 0.25% of equity risk per trade, up to 8 trades and 8 open positions per day (unchanged)."
  - "CHANGED: entry window 09:31-09:32 -> 09:47-09:48. '9:47' = the close of the 09:46-09:47 bar; a symbol that doesn't qualify then can still enter on the 09:48 bar. Reason: in big_tech_open_931 v1's backtest, 3 of 4 trades were stopped, two of them (AMD, AAPL) one bar after a 09:31 entry."
  - "CHANGED: removed exit.when_any 'bars_held >= hold_n' and the hold_n param. From 09:47, 370 bars ends at 15:57, after the 15:50 flatten, so the rule could never fire."
  - "CHANGED: the research results quoted in v1 (Mar-Apr +2.25%, Jun-Oct +4.18%) were for 09:31 entries and are not assumed to carry over; this version needs its own backtest."
  - "Minute bars: stored 1-min data starts around 2026-02-23 for these names (~137 sessions), so the requested Mar-Apr window is covered."
suggestions:
  - "Try a stop at today's low so far (day_low) instead of 0.5 x daily ATR: at 09:47 the opening range is a natural invalidation level. Cost: wider stops on volatile days mean smaller positions."
  - "Add 'close > vwap' to entry as a second check that the gap is holding. Cost: fewer trades."
  - "Cap max_open_positions at 4: eight correlated big-tech longs opened at the same minute are close to one 2%-risk bet."
  - "The 4R target was never reached in the 4 recorded trades; test 2R alongside it."
universe:
  symbols: [AAPL, MSFT, NVDA, AMZN, META, GOOGL, TSLA, AMD]
  filters:
    - adv(20) >= min_adv
timeframe: 1min
params:
  min_adv:   {value: 500_000_000, range: [100_000_000, 5_000_000_000]}
  gap_min:   {value: 0.3%, range: [0.1%, 3%]}
  stop_mult: {value: 0.5, range: [0.1, 1.0]}
  target_r:  {value: 4.0, range: [0.5, 4.0]}
entry:
  side: long
  window: "09:47-09:48"
  when_all:
    - gap >= gap_min
    - close > day_open
sizing:
  risk_per_trade: 0.25%
exit:
  stop: entry_price - stop_mult * atr_d(14)
  target: entry_price + target_r * risk_per_share
  flatten_at: "15:50"
execution:
  mode: manual
limits:
  max_trades_per_day: 8
  max_open_positions: 8
