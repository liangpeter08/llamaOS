dsl: 0.1
id: gap_fade_up_short
version: 1
source:
  text: >-
    Small gap-up fade. Stocks that open modestly above yesterday's close on no company news
    often give back part of the gap in the first hour. Research basis: Berkman, Koch, Tuttle
    & Zhang (2012, JFQA 47(4)), "Paying Attention: Overnight Returns and the Hidden Cost of
    Buying at the Open": attention-driven buying at the open pushes opening prices up
    (+10 bp overnight on average) and they reverse during the day (-7 bp), most strongly in
    high-attention stocks. Caveat: Plastun et al. (2020, NAJEF) find index gaps tend to
    continue rather than fill, and large news-driven gaps keep going, so this trades small,
    no-news gaps only.
  compiled_by: claude-opus-5-5
  prompt: compiler@v2
assumptions:
  - "Small gap: open between min_gap (0.3%) and max_gap (1.5%) above yesterday's close."
  - "No news: no fundamental headline since yesterday's close (news.fundamental, default false). Big or news gaps are excluded because they tend to continue."
  - "Trigger: the first 5-minute candle closes down (close_at(5) < day_open) and a 1-minute bar then closes below the 5-minute low, i.e. the open was the high so far."
  - "Target: yesterday's close (a full gap fill). Only traded when the fill is at least min_rr (1.0) x the risk away."
  - "Stop: the day's high at entry plus stop_buf (0.05%)."
  - "First-hour window (09:36-10:30) and flat by 11:30: the documented fill happens early; after that the edge is gone."
suggestions:
  - "Backtest max_gap 1% vs 2% and the 11:30 flatten vs 15:50."
universe:
  from: {news_today: false}
  filters:
    - adv(20) >= min_adv
    - gap >= min_gap
    - gap <= max_gap
timeframe: 1min
params:
  min_adv:    {value: 50_000_000, range: [10_000_000, 1_000_000_000]}
  min_gap:    {value: 0.3%,  range: [0.1%, 1%]}
  max_gap:    {value: 1.5%,  range: [0.5%, 3%]}
  or_minutes: {value: 5,     range: [5, 15]}
  stop_buf:   {value: 0.05%, range: [0%, 0.5%]}
  min_rr:     {value: 1.0,   range: [0.5, 3.0]}
signals:
  news.fundamental: {from: news_agent@v1, max_age: since_prior_close, default: false}
vars:
  stop_level: day_high * (1 + stop_buf)
entry:
  side: short
  window: "09:36-10:30"
  when_all:
    - close_at(or_minutes) < day_open
    - crosses_below(close, or_low(or_minutes))
    - close - prior_close >= min_rr * (stop_level - close)
    - not news.fundamental
sizing:
  risk_per_trade: 0.25%
exit:
  stop: stop_level
  target: prior_close
  flatten_at: "11:30"
execution:
  mode: manual
limits:
  max_trades_per_day: 2
