# Production overrides — used when the ECS runs prebuilt images from the registry
# (GitHub Actions path). Do NOT use for local development or for the rsync "build on the
# server" path (that path uses docker-compose.yml alone).
#
#   IMAGE_TAG=<12-char git sha> REGISTRY_NAMESPACE=<host/namespace> \
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# The cheap ECS only pulls these images; GitHub Actions builds them on a cloud runner so the
# box never compiles torch. REGISTRY_NAMESPACE is read from /opt/llamaos/.env, and IMAGE_TAG
# is exported by deploy/server-deploy.sh.
#
# Port 80 (ACME challenge + redirect) and caddy_config already live in docker-compose.yml.
services:
  broker:
    image: ${REGISTRY_NAMESPACE}/llamaos-app:${IMAGE_TAG}
    pull_policy: always
  models:
    image: ${REGISTRY_NAMESPACE}/llamaos-app:${IMAGE_TAG}
    pull_policy: always
  api:
    image: ${REGISTRY_NAMESPACE}/llamaos-app:${IMAGE_TAG}
    pull_policy: always
  watchdog:
    image: ${REGISTRY_NAMESPACE}/llamaos-app:${IMAGE_TAG}
    pull_policy: always
  operations:
    image: ${REGISTRY_NAMESPACE}/llamaos-app:${IMAGE_TAG}
    pull_policy: always
  dashboard:
    image: ${REGISTRY_NAMESPACE}/llamaos-dashboard:${IMAGE_TAG}
    pull_policy: always
